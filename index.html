  },
  ket: {
    label: "Ketones",
    groups: [
      {
        title: "Carbonyl and Methyl Ketone Tests",
        rxns: [
          card("2,4-DNP or Brady's test", "2,4-Dinitrophenylhydrazine in acidic alcohol", "C=O compound -> 2,4-DNP hydrazone + H2O", "Yellow, orange or red crystalline precipitate", "Positive for aldehydes and ketones.", "Follow with Tollens or Schiff to distinguish the two.", {named:true, tags:["Aldehydes","Ketones"]}),
          card("Tollens and Fehling comparison", "Tollens reagent and Fehling solution", "Ordinary ketone -> no oxidation under test conditions", "No silver mirror and no brick-red Cu2O precipitate", "Alpha-hydroxy ketones are an important exception and may reduce Tollens/Fehling reagents.", "Negative mild oxidation plus positive 2,4-DNP supports a ketone."),
          card("Iodoform test for methyl ketones", "I2/NaOH, warm", "RCOCH3 -> RCOO- + CHI3", "Pale yellow crystalline precipitate of iodoform", "Positive for methyl ketones and compounds oxidisable to them.", "The structural clue is CH3CO-.", {named:true}),
          card("Sodium nitroprusside test", "Sodium nitroprusside + NaOH; then acidify", "Enolate of a methyl ketone forms a coloured complex", "Red colour in alkali, often changing on acidification", "A classical test for methyl ketones, especially acetone.", "", {niche:true})
        ]
      }

  },
  carb: {
    label: "Carboxylic Acids",
    groups: [
      {
        title: "Carboxyl Group Tests",
        rxns: [
          card("Sodium bicarbonate test", "Aqueous NaHCO3", "RCOOH + NaHCO3 -> RCOONa + CO2 + H2O", "Immediate brisk effervescence; evolved CO2 turns limewater milky", "Phenols and ordinary alcohols do not liberate CO2 from bicarbonate.", "The cleanest quick test for a carboxylic acid."),
          card("Litmus and water-solubility check", "Moist blue litmus; water", "RCOOH <=> RCOO- + H+", "Blue litmus turns red; lower acids are water soluble", "This is only preliminary because many acidic substances affect litmus.", "Confirm with NaHCO3."),
          card("Ester test", "Ethanol + a few drops conc. H2SO4; warm in water bath", "RCOOH + C2H5OH <=> RCOOC2H5 + H2O", "A fruity-smelling ester is formed", "Use only as a controlled laboratory observation; do not directly inhale vapours.", "Often used as a confirmatory test after bicarbonate.")
        ]
      }
    ]
  },
  amines: {
    label: "Amines",
    groups: [
      {
        title: "Amine Detection and Classification",
        rxns: [
          card("Carbylamine test", "CHCl3 + alcoholic KOH, heat", "RNH2 -> RNC", "Only a primary amine forms a highly unpleasant-smelling isocyanide", "Positive for both aliphatic and aromatic primary amines; secondary and tertiary amines are negative.", "Never smell the product directly.", {named:true}),
          card("Hinsberg test", "Benzenesulphonyl chloride + aqueous NaOH", "1 degree -> soluble sulphonamide salt; 2 degree -> insoluble sulphonamide; 3 degree -> no sulphonamide", "Primary product dissolves in alkali and precipitates on acidification; secondary product remains insoluble; tertiary amine dissolves only after acidification", "A complete classification test for primary, secondary and tertiary amines.", "", {named:true}),
          card("Nitrous acid test", "Fresh HNO2 from NaNO2/HCl, 273-278 K", "Amine class determines diazonium, nitrosamine or salt product", "1 degree aliphatic: N2 gas; 1 degree aromatic: cold diazonium solution; 2 degree: yellow oily nitrosamine; 3 degree: no N2", "Aromatic tertiary amines can undergo ring nitrosation.", "Observe temperature carefully."),
          card("Azo dye test for primary aromatic amines", "Diazotise with NaNO2/HCl at 0-5 degree C; couple with beta-naphthol/NaOH", "ArNH2 -> ArN2+ -> azo dye", "Orange, red or scarlet dye forms", "Confirms a primary aromatic amine after successful diazotisation.", "Cold diazotisation is essential.", {named:true}),
          card("Bromine water test for aniline", "Bromine water", "C6H5NH2 -> 2,4,6-tribromoaniline", "Bromine water decolourises and a white precipitate forms", "Phenol gives a similar observation; use acid solubility or FeCl3 to distinguish them.", "Aniline dissolves in dilute HCl as anilinium salt.")

const datasets = {
  preparations: {label: "Preparations", data},
  properties: {label: "Chemical Properties", data: propertyData},
  tests: {label: "Tests", data: testData}
};

let currentTab = 'all';

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const allTabs = document.querySelectorAll('.tab');
  allTabs.forEach(t => { if(t.textContent.trim() === getTabLabel(tab)) t.classList.add('active'); });
  document.getElementById('search').value = '';
  renderAll(tab, '');
}

function getTabLabel(tab) {
  const map = {all:'All',alcohols:'Alcohols',phenols:'Phenols',ethers:'Ethers',ald:'Aldehydes',ket:'Ketones',carb:'Carboxylic Acids',amines:'Amines'};
  return map[tab] || tab;
}

const tabButtons = document.querySelectorAll('.tab');
tabButtons[0].classList.add('active');

function filterSearch() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  renderAll(currentTab, q);
}

function renderAll(tab, query) {
  const container = document.getElementById('content');
  let html = '';
  const keys = tab === 'all' ? Object.keys(data) : [tab];
  let totalShown = 0;
  keys.forEach(key => {
    const section = data[key];
    let sectionHtml = '';
    section.groups.forEach(group => {
      let groupHtml = '';
      group.rxns.forEach(rxn => {
        const searchable = (rxn.name + rxn.reagents + rxn.equation + rxn.note + rxn.mechanism).toLowerCase();
        if(query && !searchable.includes(query)) return;
        totalShown++;
        const id = 'rxn-' + Math.random().toString(36).slice(2);
        groupHtml += `<div class="rxn" id="${id}" onclick="toggle('${id}')">
          <div class="rxn-header">
            <div>
              <div class="rxn-name">${rxn.name}</div>
              <div class="rxn-reagents">${rxn.reagents}</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
              ${rxn.named ? `<span class="named-badge">Named</span>` : ''}
              ${rxn.niche ? `<span class="niche-badge">Niche</span>` : ''}
              <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
            </div>
          </div>
          <div class="rxn-detail" id="detail-${id}">
            <div class="detail-row"><span class="detail-label">Reaction</span><div class="reaction-box">${rxn.equation}</div></div>
            <div class="detail-row"><span class="detail-label">Mechanism</span><span class="detail-val">${rxn.mechanism}</span></div>
            ${rxn.note ? `<div class="detail-row"><span class="detail-label">Key point</span><span class="detail-val">${rxn.note}</span></div>` : ''}
            ${rxn.tip ? `<div class="tip"><i class="ti ti-bulb" aria-hidden="true"></i> NEET tip: ${rxn.tip}</div>` : ''}
          </div>
        </div>`;
      });
      if(groupHtml) {
        sectionHtml += `<div class="group"><div class="group-title">${tab==='all' ? section.label+' — '+group.title : group.title}</div>${groupHtml}</div>`;
      }
    });
    if(sectionHtml) html += sectionHtml;
  });
  if(!html) html = `<div class="no-results">No reactions found for "<strong>${query}</strong>"</div>`;
  container.innerHTML = html;
}

function toggle(id) {
  const rxn = document.getElementById(id);
  const detail = document.getElementById('detail-'+id);
  rxn.classList.toggle('open');
  detail.classList.toggle('open');
}

let currentSection = 'preparations';
let cardId = 0;

const categoryOrder = ['alcohols','phenols','ethers','ald','ket','carb','amines'];
const categoryLabels = {
  all: 'All',
  alcohols: 'Alcohols',
  phenols: 'Phenols',
  ethers: 'Ethers',
  ald: 'Aldehydes',
  ket: 'Ketones',
  carb: 'Carboxylic Acids',
  amines: 'Amines'
};

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(button => {
    button.classList.toggle('active', button.textContent.trim() === categoryLabels[tab]);
  });
  filterSearch();
}

function showSection(sectionKey) {
  currentSection = sectionKey;
  document.querySelectorAll('.section-tab').forEach(button => {
    const active = button.dataset.section === sectionKey;
    button.classList.toggle('active', active);
    button.setAttribute('aria-selected', String(active));
  });
  filterSearch();
}

function filterSearch() {
  const query = document.getElementById('search').value.toLowerCase().trim();
  renderAll(currentTab, query);
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, character => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  })[character]);
}

function renderCard(rxn, datasetKey) {
  cardId += 1;
  const id = `rxn-${cardId}`;
  const isTest = datasetKey === 'tests';
  const sourceBadges = (rxn.categoryTags || [])
    .map(tag => `<span class="section-badge">${tag}</span>`)
    .join('');

  return `<div class="rxn" id="${id}" onclick="toggle('${id}')">
    <div class="rxn-header">
      <div>
        <div class="rxn-name">${rxn.name}</div>
        <div class="rxn-reagents">${rxn.reagents}</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;flex-shrink:0">
        ${sourceBadges}
        ${rxn.named ? `<span class="named-badge">Named</span>` : ''}
        ${rxn.niche ? `<span class="niche-badge">Niche</span>` : ''}
        <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
      </div>
    </div>
    <div class="rxn-detail" id="detail-${id}">
      <div class="detail-row"><span class="detail-label">${isTest ? 'Test reaction' : 'Reaction'}</span><div class="reaction-box">${rxn.equation}</div></div>
      <div class="detail-row"><span class="detail-label">${isTest ? 'Positive result' : 'Mechanism'}</span><span class="detail-val">${rxn.mechanism}</span></div>
      ${rxn.note ? `<div class="detail-row"><span class="detail-label">Key point</span><span class="detail-val">${rxn.note}</span></div>` : ''}
      ${rxn.tip ? `<div class="tip"><i class="ti ti-bulb" aria-hidden="true"></i> NEET tip: ${rxn.tip}</div>` : ''}
    </div>
  </div>`;
}

function renderAll(tab, query) {
  const container = document.getElementById('content');
  const searching = Boolean(query);
  const datasetKeys = searching ? Object.keys(datasets) : [currentSection];
  const categoryKeys = searching
    ? categoryOrder
    : (tab === 'all' ? categoryOrder : [tab]);
  let html = '';
  cardId = 0;

  datasetKeys.forEach(datasetKey => {
    const dataset = datasets[datasetKey];
    categoryKeys.forEach(categoryKey => {
      const category = dataset.data[categoryKey];
      if(!category) return;

      category.groups.forEach(group => {
        let groupHtml = '';
        group.rxns.forEach(rxn => {
          const searchable = [
            dataset.label,
            category.label,
            group.title,
            rxn.name,
            rxn.reagents,
            rxn.equation,
            rxn.note,
            rxn.mechanism,
            rxn.tip,
            ...(rxn.categoryTags || [])
          ].join(' ').toLowerCase();

          if(searching && !searchable.includes(query)) return;
          groupHtml += renderCard(rxn, datasetKey);
        });

        if(groupHtml) {
          let title = group.title;
          if(searching) title = `${dataset.label} / ${category.label} - ${group.title}`;
          else if(tab === 'all') title = `${category.label} - ${group.title}`;
          html += `<div class="group"><div class="group-title">${title}</div>${groupHtml}</div>`;
        }
      });
    });
  });

  if(!html) {
    html = `<div class="no-results">No entries found for "<strong>${escapeHtml(query)}</strong>"</div>`;
  }
  container.innerHTML = html;
}

document.querySelectorAll('.section-tab').forEach(button => {
  button.addEventListener('click', () => showSection(button.dataset.section));
});

renderAll('all','');
</script>
</body></html>
